# Use root/example as user/password credentials

services:

  mysql:
    image: mysql:26.7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PWD}
      MYSQL_DATABASE: ${DB}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PWD}
    # (this is just an example, not intended to be a production configuration)
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PWD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: