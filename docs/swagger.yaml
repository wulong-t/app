basePath: /
definitions:
  models.CreateUser:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 5
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
host: localhost:8082
info:
  contact: {}
  description: This is a sample server celler server based on Gin.
  title: Gin Golang Restspi
  version: "1.0"
paths:
  /user/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, password, first name, and last
        name
      parameters:
      - description: user register details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CreateUser'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Auth
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: API Key authorization
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
